aid: whop
url: https://raw.githubusercontent.com/api-evangelist/whop/refs/heads/main/apis.yml
name: Whop
kind: company
description: >-
  Whop is a marketplace and commerce platform for selling digital products,
  memberships, and access to online communities, courses, software, and other
  creator offerings. Sellers ("companies") list products (access passes) with
  pricing plans, take payments, and manage member access - often gating Discord
  or Telegram communities, apps, and content. Whop exposes a public developer
  platform: a current REST API (v1) at api.whop.com/api/v1 and a GraphQL API at
  api.whop.com/public-graphql, covering memberships, products, plans, payments,
  users, companies, checkout, transfers/payouts, webhooks, and more, plus an app
  framework, JavaScript/Python/Ruby SDKs, OAuth, and a realtime WebSocket for
  apps. Whop is free to start and monetizes through transaction fees rather than
  a subscription for API access.
