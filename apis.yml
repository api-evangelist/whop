- aid: whop:whop-graphql-api
  name: Whop GraphQL API
  tags:
  - GraphQL
  - Application
  tags_raw:
  - GraphQL
  - Apps
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.whop.com/developer/api/getting-started
  baseURL: https://api.whop.com/public-graphql
  properties:
  - url: https://docs.whop.com/developer/api/getting-started
    type: Documentation
  - url: graphql/whop-graphql.md
    type: GraphQL
  - url: graphql/whop-schema.graphql
    type: GraphQL
  description: >-
    Whop's GraphQL API at api.whop.com/public-graphql, positioned as the current primary interface for
    building apps - search/discovery, access passes, plans, memberships, users, and messaging - authenticated
    with a Bearer token plus optional x-on-behalf-of and x-company-id context headers.
- aid: whop:whop-realtime-websocket-api
  name: Whop Realtime WebSocket API
  tags:
  - WebSocket
  - Real-Time
  - Application
  tags_raw:
  - WebSocket
  - Realtime
  - Apps
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.whop.com/apps/features/websocket-guide
  baseURL: wss://realtime.whop.com
  properties:
  - url: https://docs.whop.com/apps/features/websocket-guide
    type: Documentation
  - url: asyncapi/whop-asyncapi.yml
    type: AsyncAPI
  description: >-
    Bidirectional realtime WebSocket for Whop apps - custom app messages and chat/feed updates - connected
    and authenticated through the @whop/react and @whop/api SDKs. Whop does not publish a raw wss:// endpoint
    URL; the base URL shown is a modeled placeholder (see the AsyncAPI document).
