description: >-
  FinOps view of building on Whop. Unlike a metered API vendor, Whop's cost is
  driven by transaction economics: payment processing fees on each sale
  (2.7% + $0.30 domestic, with international / conversion / ACH variants),
  payout fees per withdrawal, dispute and fraud fees, and optional
  revenue-optimization fees (tax, affiliate). The API itself carries no
  metered per-call charge; cost management here means minimizing effective
  take-rate across the money movement the API orchestrates.
notes: >-
  Fees grounded against https://docs.whop.com/fees as of 2026-07-05. Reported
  effective take-rate for creators gating communities (Discord/Telegram) is
  commonly cited near 6-7% all-in; treat as directional and verify.
