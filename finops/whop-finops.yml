meters:
- name: processing_fee
  description: Payment processing fee per successful sale (2.7% + $0.30 domestic; +1.5% intl; +1% conversion).
  unit: transactions
  aggregation: sum
  dimensions:
  - company
  - currency
  - card_type
- name: payout_fee
  description: Fee per payout / withdrawal, varying by method (ACH, RTP, crypto, wire).
  unit: payouts
  aggregation: sum
  dimensions:
  - company
  - method
- name: dispute_fee
  description: Fee per dispute ($15) and per early dispute alert ($29).
  unit: disputes
  aggregation: sum
  dimensions:
  - company
- name: fraud_fee
  description: Optional fraud tooling fees (3DS $0.03, Radar $0.07 per transaction).
  unit: transactions
  aggregation: sum
  dimensions:
  - company
- name: tax_fee
  description: Tax and remittance fee (2% per transaction when tax is collected).
  unit: transactions
  aggregation: sum
  dimensions:
  - company
- name: affiliate_fee
  description: Affiliate processing fee (1.25% per transaction) when affiliate payouts apply.
  unit: transactions
  aggregation: sum
  dimensions:
  - company
principles:
- name: Visibility
  description: Pull payments, fees, refunds, and payout records via the API to see true effective take-rate per product and plan.
- name: Allocation
  description: Tag payments by product / plan / company and map fees to the sale that generated them for per-offer margin.
- name: Optimization
  description: Prefer cheaper payout methods (ACH over instant/crypto/wire), reduce disputes to avoid $15/$29 fees, and weigh tax/affiliate features against their per-transaction cost.
- name: Accountability
  description: Assign an owner per company / storefront; review effective fee percentage monthly against a target take-rate.
